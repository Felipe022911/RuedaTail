<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Campaña Oficial</title>
    <!-- Vinculación del CSS compilado por la CLI -->
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-slate-950">

    <main class="max-w-6xl mx-auto px-4 py-12">
        
        <!-- Sección Principal (Hero Prototipo) -->
        <section class="space-y-6 text-center md:text-left bg-slate-900 p-8 md:p-12 rounded-3xl shadow-2xl border border-slate-800">
            <div>
                <span class="inline-block bg-amber-400/10 text-amber-400 border border-amber-400/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                    Nuevo · Jueves a sábado
                </span>
            </div>
            
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-white leading-tight">
                Rueda Nocturna
            </h1>
            
            <p class="text-lg md:text-xl text-slate-300 max-w-2xl leading-relaxed">
                Descubre Medellín en bici cuando se encienden las luces.
            </p>

            <!-- Datos destacados -->
            <div class="flex flex-wrap justify-center md:justify-start gap-6 py-2">
                <div class="bg-slate-950/60 px-5 py-3 rounded-xl border border-slate-800">
                    <span class="block text-xs uppercase tracking-wider text-slate-400">Variedad</span>
                    <span class="text-xl font-bold text-amber-400">3 rutas</span>
                </div>
                <div class="bg-slate-950/60 px-5 py-3 rounded-xl border border-slate-800">
                    <span class="block text-xs uppercase tracking-wider text-slate-400">Tarifa base</span>
                    <span class="text-xl font-bold text-amber-400">Desde $55.000</span>
                </div>
            </div>
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-4 pt-4">
                
                <!-- 1. Botón Principal -->
                <a href="#rutas" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-xl shadow-lg transition-all duration-200 outline-none focus:ring-4 focus:ring-amber-500/50">
                    Inscríbete
                </a>

                <!-- 2. Botón Secundario -->
                <a href="#tarifas" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-6 py-3 rounded-xl border border-slate-700 transition-all duration-200 outline-none focus:ring-4 focus:ring-slate-700/50">
                    Ver tarifas
                </a>

                <!-- 3. Botón de Contorno -->
                <button type="button" class="border border-amber-500/50 hover:bg-amber-500/10 text-amber-400 font-medium px-6 py-3 rounded-xl transition-all duration-200 outline-none focus:ring-4 focus:ring-amber-500/40">
                    Ver recorridos
                </button>

            </div>
        </section>

    </main>

</body>
</html>
